{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="RetailX - India's smartest fashion & lifestyle shopping destination. Best prices, verified reviews, easy returns." />

  <title>{% block title %}RetailX — India's Smartest Shopping Destination{% endblock %}</title>

  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- Custom Styles -->
  <link href="/media/css/ui.css" rel="stylesheet" type="text/css" />
  <link href="/media/css/responsive.css" rel="stylesheet" />
  <link href="/media/css/footer.css" rel="stylesheet" type="text/css" />
  <link href="/media/css/register.css" rel="stylesheet" type="text/css" />

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    * { font-family: 'Inter', 'Segoe UI', sans-serif; box-sizing: border-box; }
    a { text-decoration: none; }
    body { background: #fafafa; margin: 0; padding: 0; }
  </style>
</head>

<body>
  {% include 'home/navbar.html' %}
  {% block start %}{% endblock %}

  {% block footer %}
  {% include 'home/footer.html' %}
  {% endblock %}

  <!-- WhatsApp Floating Chat -->
  <a href="https://wa.me/919876543210?text=Hello%20RetailX%20Support!%20I%20need%20help%20with%20my%20order." target="_blank" class="whatsapp-float">
    <i class="fab fa-whatsapp"></i>
  </a>
  <style>
    .whatsapp-float {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 40px;
      right: 40px;
      background-color: #25d366;
      color: #FFF;
      border-radius: 50Px;
      text-align: center;
      font-size: 30px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.15);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .whatsapp-float:hover {
      transform: scale(1.1) translateY(-5px);
      color: white;
    }
    .whatsapp-float i {
      margin-top: 2px;
    }
    @media (max-width: 768px) {
      .whatsapp-float {
        width: 50px;
        height: 50px;
        bottom: 20px;
        right: 20px;
        font-size: 25px;
      }
    }
  </style>
</body>

</html>
