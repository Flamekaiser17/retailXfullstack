{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="RetailX - India's smartest fashion & lifestyle shopping destination. Best prices, verified reviews, easy returns." />

  <title>{% block title %}RetailX — India's Smartest Shopping Destination{% endblock %}</title>

  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- Custom Styles -->
  <link href="/media/css/ui.css" rel="stylesheet" type="text/css" />
  <link href="/media/css/responsive.css" rel="stylesheet" />
  <link href="/media/css/footer.css" rel="stylesheet" type="text/css" />
  <link href="/media/css/register.css" rel="stylesheet" type="text/css" />

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    * { font-family: 'Inter', 'Segoe UI', sans-serif; box-sizing: border-box; }
    a { text-decoration: none; }
    body { background: #fafafa; margin: 0; padding: 0; }
  </style>
</head>

<body>
  {% include 'home/navbar.html' %}
  {% block start %}{% endblock %}

  {% block footer %}
  {% include 'home/footer.html' %}
  {% endblock %}
</body>

</html>
